<!DOCTYPE html>
<html>

<head>
    <title>Mayor de dos números</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>

        function mayor(numero1, numero2) {

            if (numero1 > numero2) {
                return numero1;
            } else {
                return numero2;
            }

        }

        let num1 = parseInt(prompt("Ingrese el primer número por favor amiguita o amigue:"));
        let num2 = parseInt(prompt("Ingrese el segundo número amiguita o amigue:"));

        let resultado = mayor(num1, num2);

        document.write("El número mayor es amiguita esss: " + resultado);

    </script>

</body>

</html>
