<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructuras secuenciales de programación.</title>
</head>
<body>
    <script>
        let numero1=prompt('ingrese su numero');
        document.write('<br>')
        let numero2=prompt('ingrese su segundo numero');
        document.write('<br>')
        document.write('su primer numero es' + numero1);
        document.write('<br>');
        document.write('su segundo numero es' + numero2);
        document.write('<br>');

        let suma= parseInt(numero1) + parseInt (numero2);
        document.write('el resultado de su suma es: ' + suma);
        document.write('<br>');

                let multiplicacion= parseInt(numero1) * parseInt (numero2);
        document.write('el resultado de su resta es: '+ multiplicacion);
        document.write('<br>');

                let divicion= parseInt(numero1) / parseInt (numero2);
        document.write('el resultado de su divicion es:' + divicion);
        document.write('<br>');

                let resta= parseInt(numero1) - parseInt (numero2);
        document.write('el resultado de su resta es: ' + resta);
        document.write('<br>');
        
    </script>
</body>
</html>
