<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura repetitiva (for)</title>
</head>
<body>
    <script>
        for (let f = 1; f != 10; f++) {
        document.write('el valor de f es: ' + f + ', no es 10' + '<br>');
    }
    document.write('el valor de f es: ' + f + ', ¡¡¡¡¡¡¡¡¡¡¡¡¡¡¡¡¡es 10!!!!!!!!!!!!!!!!' + '<br>' + 'Chauuuuuuuuuuuuu');
    </script>
</body>
</html>
