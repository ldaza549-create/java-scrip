<!DOCTYPE html>
<html>

<head>
    <title>Ejercicio de JavaScript</title>
    <meta charset="UTF-8">
</head>

<body>

    <script>

        function mostrarComprendidos(inicio, fin) {

            for (let f = inicio; f <= fin; f++) {
                document.write(f + " ");
            }

        }

        let valor1 = parseInt(prompt("Ingrese valor inferior amiga:"));
        let valor2 = parseInt(prompt("Ingrese valor superior amiga:"));

        mostrarComprendidos(valor1, valor2);

    </script>

</body>
</html>
