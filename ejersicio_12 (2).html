<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructura repetitiva (while)</title>
</head>
<body>
    
    <script>
        let x = 1;
        while (x != 100) {
            document.write('el valor de x es: ' + x + ', no es 100' + '<br>');
            x = x + 1;
        }
        document.write('el valor de x es: ' + x + ', ¡¡¡¡¡¡¡¡¡¡¡¡¡¡¡¡¡es 100!!!!!!!!!!!!!!!!' + '<br>' + 'Chauuuuuuuuuuuuu');
    </script>
</body>
</html>
