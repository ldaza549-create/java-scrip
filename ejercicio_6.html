<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructuras condicionales simples.</title>
</head>
<body>
    <script>

/*-----------------------if--------------------------------------------------------------------------------------------------------------------*/
        let nombre= prompt('ingrese su nombre')
        let edad= prompt('ingrese su edad')

        if (edad >=18) {
            document.write('usted ' + nombre + ' es mayor de edad')
        }

/*--------------------------if else------------------------------------------------------------------------------------------------------------------*/
        else{
            document.write('usted ' + nombre+ ' es menor de edad')
        }


    </script>
</body>
</html>
