<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estructuras switch. </title>
</head>
<body>
    <script>
        let valor= prompt('ingrese una letra');
        switch(valor){
            case 'y': 
            alert('yellow');
            break;
            case 'b':
                alert('blue');
            break;
            case 'r':
                alert('red');   
                break;
default:
    alert ('color no encontrado')
        
        }
    </script>
</body>
</html>
